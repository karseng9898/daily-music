<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日音乐 · 帕格尼尼 × 半音阶的写法</title>
<style>
:root{--bg:#1d1b2e;--card:#2a2740;--ink:#f3f0ff;--mute:#b9b3d6;--pink:#ffb3c7;--mint:#a8f0d4;--sky:#a9d6ff;--lem:#ffe9a3;--lav:#cdb8ff;--bad:#ff9a9a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 60px}
header{text-align:center;padding:14px 0 6px}
.notes{font-size:30px;height:44px}.notes span{display:inline-block;animation:bob 1.6s ease-in-out infinite;color:var(--lav)}
.notes span:nth-child(2){animation-delay:.2s;color:var(--pink)}.notes span:nth-child(3){animation-delay:.4s;color:var(--mint)}.notes span:nth-child(4){animation-delay:.6s;color:var(--sky)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-12px) rotate(6deg)}}
h1{margin:4px 0 2px;font-size:25px;line-height:1.3}.date{color:var(--mute);font-size:14px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--card);border-radius:99px;padding:6px 14px;font-size:14px}
.bar{height:10px;background:#3a3658;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sky),var(--lav));transition:width .5s}
.small{font-size:13px;color:var(--mute);text-align:center}
.card{background:var(--card);border-radius:20px;padding:16px 16px 18px;margin:14px 0;animation:rise .5s both}
.card:nth-of-type(2){animation-delay:.08s}.card:nth-of-type(3){animation-delay:.16s}.card:nth-of-type(4){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:8px;padding:2px 10px;color:#1d1b2e;margin-bottom:6px}
h2{font-size:20px;margin:2px 0 6px}p{margin:6px 0}
.btn{appearance:none;border:0;border-radius:14px;min-height:48px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;color:#1d1b2e;background:var(--mint);margin:6px 6px 0 0;transition:transform .1s}
.btn:active{transform:scale(.95)}.btn.alt{background:var(--sky)}.btn.ghost{background:#3a3658;color:var(--ink)}
svg.staff{width:100%;height:auto;background:#fffaf0;border-radius:14px;margin-top:8px;touch-action:manipulation}
.staff line{stroke:#4a4560;stroke-width:1.2}.staff .nh{fill:#2a2740;cursor:pointer;transition:fill .15s}
.staff .n{opacity:0;animation:drop .45s cubic-bezier(.3,1.6,.6,1) forwards}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.staff .on .nh{fill:#ff6f9a}.staff text{font-family:serif;fill:#2a2740}.staff .lb{font:13px sans-serif;fill:#6b6590}
.flip{perspective:600px;margin-top:10px;cursor:pointer}
.flip>div{position:relative;min-height:110px;transition:transform .5s;transform-style:preserve-3d}
.flip.open>div{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:12px 14px;display:flex;align-items:center}
.flip .f{background:var(--lem);color:#1d1b2e;font-weight:700;justify-content:center}.flip .b{background:#3a3658;transform:rotateY(180deg);font-size:15px}
.eq{display:inline-flex;gap:3px;height:18px;align-items:flex-end;vertical-align:middle;margin-left:6px}
.eq b{width:4px;background:#1d1b2e;height:4px;border-radius:2px}.playing .eq b{animation:eq .6s ease-in-out infinite alternate}
.eq b:nth-child(2){animation-delay:.15s}.eq b:nth-child(3){animation-delay:.3s}
@keyframes eq{to{height:18px}}
.opt{display:block;width:100%;text-align:left;background:#3a3658;color:var(--ink);border:2px solid transparent;border-radius:14px;min-height:50px;padding:10px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt.ok{background:#2f5a4c;border-color:var(--mint)}.opt.no{background:#5a2f3a;border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ex{display:none;background:#23203a;border-left:4px solid var(--lav);border-radius:8px;padding:8px 12px;font-size:15px}.ex.show{display:block;animation:rise .3s}
.q{margin-top:14px}.q b{color:var(--lem)}
a{color:var(--sky)}
.done{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;cursor:pointer;min-height:56px}
.done input{width:30px;height:30px;accent-color:#a8f0d4}
.flame{display:inline-block;animation:fl 1s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(1.18) rotate(4deg)}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
.hero{margin:10px 0 12px;border-radius:18px;overflow:hidden;aspect-ratio:1/1;max-width:360px;box-shadow:0 6px 18px rgba(0,0,0,.12);animation:hfade 1.2s ease-out both}
.hero img{display:block;width:100%;height:100%;object-fit:cover;animation:kb 18s ease-in-out infinite alternate}
@keyframes hfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08) translate(-1.5%,-1%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.staff .n{opacity:1}}
</style></head><body>
<canvas id="cf"></canvas>
<main>
<header>
 <div class="notes"><span>♪</span><span>♫</span><span>♩</span><span>♬</span></div>
 <h1 id="title"></h1><div class="date" id="date"></div>
 <div class="chips"><span class="chip" id="streak"></span><span class="chip" id="exam"></span></div>
 <div class="bar"><i id="prog"></i></div><div class="small" id="progt"></div>
</header>

<section class="card"><span class="tag" style="background:var(--sky)">① 乐理 · 1 分钟</span>
 <h2 id="th"></h2><p id="tx"></p>
 <svg class="staff" id="staff" role="img" aria-label="五线谱示例"></svg>
 <div class="small" id="tcap" style="text-align:left;margin-top:4px"></div>
 <button class="btn" id="playSeq">▶ 一个个听</button><button class="btn alt" id="playChord">🎶 一起听</button>
 <div class="small" style="text-align:left">提示:点谱上的音符也能单独发声</div>
</section>

function pn(s){const[t,lab]=s.split(":");if(t==="|")return{bar:1};const m=t.match(/^([A-G])(#|b|x|bb)?(\d)$/);if(!m)return null;
 const acc={"#":1,"b":-1,"x":2,"bb":-2}[m[2]]||0,o=+m[3],idx=o*7+L[m[1]];
 return{idx,acc,lab:lab||"",f:440*Math.pow(2,(12*(o+1)+SEMI[L[m[1]]]+acc-69)/12)};}
const items=D.theory.example.notes.map(pn).filter(Boolean);
const svg=$("staff"),X0=88,DX=46,W=X0+DX*items.length+16,Y=i=>110-(i-30)*6;
let h='';for(let i=0;i<5;i++)h+=`<line x1="8" x2="${W-8}" y1="${110-i*12}" y2="${110-i*12}"/>`;
h+=`<path d="M36 128Q29 128 30 122Q32 116 38 119Q41 121 40 126L44 50Q47 40 53 48Q57 58 41 74Q24 90 30 104Q37 116 50 108Q58 100 50 92Q42 86 36 94Q34 100 40 102" fill="none" stroke="#2a2740" stroke-width="3" stroke-linecap="round"/>`;
let groups=[[]];items.forEach((it,k)=>{const x=X0+DX*k;
 if(it.bar){h+=`<line x1="${x}" x2="${x}" y1="62" y2="110"/>`;groups.push([]);return;}
 groups[groups.length-1].push(it);const y=Y(it.idx);let g=`<g class="n" data-k="${k}" style="animation-delay:${.15*k}s">`;
 for(let l=28;l>=it.idx;l-=2)g+=`<line x1="${x-13}" x2="${x+13}" y1="${Y(l)}" y2="${Y(l)}"/>`;
 for(let l=40;l<=it.idx;l+=2)g+=`<line x1="${x-13}" x2="${x+13}" y1="${Y(l)}" y2="${Y(l)}"/>`;
 if(it.acc)g+=`<text x="${x-24}" y="${y+6}" font-size="20">${{1:"♯","-1":"♭",2:"𝄪","-2":"𝄫"}[it.acc]}</text>`;
 const up=it.idx<34;g+=`<line x1="${up?x+7:x-7}" x2="${up?x+7:x-7}" y1="${y}" y2="${up?y-34:y+34}" style="stroke:#2a2740;stroke-width:1.6"/>`;
 g+=`<ellipse class="nh" cx="${x}" cy="${y}" rx="8" ry="6" transform="rotate(-20 ${x} ${y})"/>`;
 g+=`<rect x="${x-20}" y="20" width="40" height="140" fill="transparent" style="cursor:pointer"/>`;
 if(it.lab)g+=`<text class="lb" x="${x}" y="172" text-anchor="middle">${esc(it.lab)}</text>`;
 h+=g+'</g>';});
svg.setAttribute("viewBox",`0 0 ${W} 182`);svg.innerHTML=h;
let ac;function A(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}
function tone(f,t0,dur){const a=A(),o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=f;
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.22,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur+.05);}
function flash(k,ms){const el=svg.querySelector(`[data-k="${k}"]`);if(!el)return;setTimeout(()=>{el.classList.add("on");setTimeout(()=>el.classList.remove("on"),380)},ms);}
svg.addEventListener("click",e=>{const g=e.target.closest(".n");if(!g)return;const k=+g.dataset.k;tone(items[k].f,A().currentTime,.6);flash(k,0);mark("theory");});
$("playSeq").onclick=()=>{const t=A().currentTime+.05;let j=0;items.forEach((it,k)=>{if(it.bar){j+=.3;return}tone(it.f,t+j,.55);flash(k,j*1000);j+=.5;});mark("theory");};
$("playChord").onclick=()=>{const t=A().currentTime+.05;let j=0,k=0;groups.forEach(gr=>{gr.forEach(it=>{tone(it.f,t+j,1.3);});
 items.forEach((it,i)=>{if(gr.includes(it))flash(i,j*1000)});if(gr.length)j+=1.4;});mark("theory");};
// ---------- composer ----------
const C=D.composer;$("cn").textContent=C.name+(C.name_en?" · "+C.name_en:"");$("cy").textContent=C.years;$("cs").textContent=C.story;$("ff").textContent=C.fun_fact;
$("flip").onclick=function(){this.classList.toggle("open")};
if(AUDIO.length>20){$("aud").innerHTML='<button class="btn" id="ap">▶ 听故事<span class="eq"><b></b><b></b><b></b></span></button><button class="btn ghost" id="sp">1x</button>';
 const au=new Audio("data:audio/mpeg;base64,"+AUDIO),ap=$("ap");
 ap.onclick=()=>{if(au.paused){au.play();}else au.pause();};
 au.onplay=()=>{ap.classList.add("playing");ap.firstChild.textContent="⏸ 暂停"};au.onpause=()=>{ap.classList.remove("playing");ap.firstChild.textContent="▶ 继续听"};
 au.onended=()=>{ap.classList.remove("playing");ap.firstChild.textContent="↺ 再听一次";mark("story")};
 const sp=[1,1.25,1.5];let si=0;$("sp").onclick=()=>{si=(si+1)%3;au.playbackRate=sp[si];$("sp").textContent=sp[si]+"x"};
}else{$("cs").onclick=()=>mark("story");setTimeout(()=>mark("story"),20000);}
// ---------- listening ----------
const Lp=D.listening;$("lp").textContent="🎧 "+Lp.piece+" — "+Lp.composer;$("lf").textContent="留意:"+Lp.listen_for;
$("yt").href="https://www.youtube.com/results?search_query="+encodeURIComponent(Lp.search||(Lp.piece+" "+Lp.composer));
// ---------- quiz ----------
let answered=0;$("quiz").innerHTML=D.quiz.map((q,i)=>`<div class="q"><b>Q${i+1}.</b> ${esc(q.q)}`+q.options.map((o,j)=>`<button class="opt" data-q="${i}" data-o="${j}">${"ABCD"[j]}. ${esc(o)}</button>`).join("")+`<div class="ex" id="ex${i}"></div></div>`).join("");
$("quiz").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b)return;const i=+b.dataset.q,j=+b.dataset.o,q=D.quiz[i],ex=$("ex"+i);
 if(ex.dataset.solved)return;
 if(j===q.answer){b.classList.add("ok");ex.dataset.solved=1;ex.innerHTML="✅ 答对了!"+esc(q.explain);boom();if(++answered===D.quiz.length)mark("quiz");}
 else{b.classList.add("no");ex.innerHTML="🤔 差一点,再试试。";}
 ex.classList.add("show");});
// ---------- practice ----------
$("tip").textContent="🎯 "+D.practice_tip;
// ---------- confetti (tiny) ----------
const cv=$("cf"),cx=cv.getContext("2d");let P=[],run=0;
function boom(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;cv.width=innerWidth;cv.height=innerHeight;const cl=["#ffb3c7","#a8f0d4","#a9d6ff","#ffe9a3","#cdb8ff"];
 for(let i=0;i<70;i++)P.push({x:cv.width/2,y:cv.height*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+3,c:cl[i%5],a:Math.random()*6,l:90});
 if(!run){run=1;requestAnimationFrame(step)}}
function step(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();});
 if(P.length)requestAnimationFrame(step);else{run=0;cx.clearRect(0,0,cv.width,cv.height)}}
streak();prog();
</script></body></html>
